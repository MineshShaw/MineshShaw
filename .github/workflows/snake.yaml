name: Generate Professional Metrics

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Developer Dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.svg
          config_theme: synthwave
          
          # Core stats (Disables the redundant commit calendar)
          base: header, repositories
          base_indepth: yes
          
          # Plugin 1: Lines of code added/deleted
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
          
          # Plugin 2: Accurate language breakdown
          plugin_languages: yes
          plugin_languages_details: percentage
          
          # Plugin 3: Issue & PR Follow-up (Shows engineering maturity)
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_followup_indepth: yes