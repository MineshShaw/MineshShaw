name: Generate Fast Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Developer Dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          config_theme: synthwave
          
          # Core stats - crucially tells the API to IGNORE forked repositories
          base: header, repositories
          repositories_forks: no
          
          # Accurate language breakdown showing only your actual code
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          
          # Issue & PR Follow-up
          plugin_followup: yes
          plugin_followup_sections: repositories