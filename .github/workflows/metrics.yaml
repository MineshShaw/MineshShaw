name: Generate Professional Metrics

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Developer Dashboard
        uses: lowlighter/metrics@latest
        with:
          # This line now uses your custom token to see ALL your repositories
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          
          # Forces the dark neon theme
          config_theme: synthwave
          
          # Core stats
          base: header, repositories
          base_indepth: yes
          
          # Lines of code tracking
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
          
          # Accurate language breakdown
          plugin_languages: yes
          plugin_languages_details: percentage
          
          # Issue & PR Follow-up
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_followup_indepth: yes