name: Generate Metrics & Streak

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # JOB 1: Your developer dashboard
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Developer Dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          base: header, repositories
          repositories_forks: no
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 10
          plugin_followup: yes
          plugin_followup_sections: repositories

  # JOB 2: Your streak stats
  streak-stats:
    needs: github-metrics 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main # Explicitly targets your main branch
          
      - name: Sync with Remote
        run: |
          git pull origin main # <--- MOVED HERE: Pulls Job 1 changes before generating

      - name: Generate Streak SVG
        uses: be-next/github-streak-stats-action@v1
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.METRICS_TOKEN }}
          output-path: streak.svg
          hide-border: true
          # Custom Synthwave Colors 
          background: 0D1117
          currStreakNum: FF00FF
          sideNums: 00FFFF
          currStreakLabel: 39FF14
          sideLabels: 39FF14
          dates: BF00FF
          ring: FF00FF
          fire: FF00FF
          
      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
