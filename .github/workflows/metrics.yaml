name: Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Developer Dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          base: header, repositories
          repositories_forks: no
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_followup: yes
          plugin_followup_sections: repositories

          extras_css: |
            :root {
              --color-calendar-graph-day-bg: #0D1117;
              --color-calendar-graph-day-L1-bg: #4A0080;
              --color-calendar-graph-day-L2-bg: #BF00FF;
              --color-calendar-graph-day-L3-bg: #00FFFF;
              --color-calendar-graph-day-L4-bg: #39FF14;
            }
            body { 
              background-color: #0D1117 !important;
              color: #FF00FF !important;
            }
            h2, h3, h1 {
              color: #00FFFF !important;
            }